services:
  - type: web
    name: prebunk-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PREBUNK_CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /health
